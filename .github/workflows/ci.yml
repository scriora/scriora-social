name: CI - scriora-social

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-social-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript / Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Biome / Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

  unit-tests:
    name: Tests / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test -- --coverage --passWithNoTests

  contract-tests:
    name: Tests / Contract (MSW Mocks)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/contract/ --passWithNoTests

  integration-tests:
    name: Tests / Integration (Platform Mocks)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm vitest run test/integration/ --passWithNoTests

  build:
    name: Build / Compile
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
